[project]
name = "youtube-ripper"
version = "0.1.0"
description = "Extract audio from YouTube, transcribe with Whisper, generate text transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "flask>=3.1.2",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "yt-dlp[default]>=2026.10.26",
]
